{% extends "base.html" %}{% block title %}Activity{% endblock %}{% block content %}
<div class="container py-4"><h2 class="fw-bold">My Activity</h2><p class="text-muted">Recent complaint events and status changes.</p><div class="card border-0 shadow-sm"><div class="card-body"><div class="list-group list-group-flush">{% for h in history %}<div class="list-group-item d-flex justify-content-between"><div><strong>{{ h.status }}</strong> — {{ h.title }}</div><small class="text-muted">{{ h.date }}</small></div>{% else %}<p class="text-muted">No activity yet.</p>{% endfor %}</div></div></div></div>{% endblock %}
