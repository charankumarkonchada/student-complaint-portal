{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="auth-center-card">
    <h2 class="fw-bold mb-2">Verify OTP</h2>
    <p class="text-muted small mb-4">Enter the 6-digit OTP sent to {{ email }}.</p>
    <form method="post">
        <div class="mb-3">
            <input class="form-control" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit OTP" required style="padding:13px;font-size:1.1rem;letter-spacing:4px;text-align:center;">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Verify OTP</button>
    </form>
    <p class="text-muted small mt-4 mb-0">
        OTP expires in 10 minutes. <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Request a new OTP</a>
    </p>
</div>
{% endblock %}
