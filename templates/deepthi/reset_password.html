{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/deepthi/reset_password.css') }}">
{% endblock %}
{% extends "base.html" %}
{% block title %}Create New Password{% endblock %}
{% block favicon %}<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon-lock.svg') }}">{% endblock %}
{% block content %}
<div style="max-width:520px;margin:70px auto;padding:36px;background:#fff;border-radius:20px;box-shadow:0 15px 45px rgba(15,23,42,.10);">
  <h2 style="margin-bottom:8px;">Create New Password</h2>
  <p style="color:#64748b;margin-bottom:24px;">OTP verified. Choose a strong new password.</p>
  <form method="POST">
    <label for="password">New Password</label>
    <input type="password" id="password" name="password" minlength="8" required style="width:100%;padding:12px;margin:8px 0 18px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;">
    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required style="width:100%;padding:12px;margin:8px 0 18px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;">
    <button type="submit" style="width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer;">Update Password</button>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/deepthi/reset_password.js') }}"></script>
{% endblock %}
