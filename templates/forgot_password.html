{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div style="max-width:520px;margin:70px auto;padding:36px;background:#fff;border-radius:20px;box-shadow:0 15px 45px rgba(15,23,42,.10);">
  <h2 style="margin-bottom:8px;">Forgot Password?</h2>
  <p style="color:#64748b;margin-bottom:24px;">Enter your registered email. We’ll send a 6-digit OTP to verify your identity.</p>
  <form method="POST">
    <label for="email">Registered Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required style="width:100%;padding:12px;margin:8px 0 18px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;">
    <button type="submit" style="width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer;">Send OTP</button>
  </form>
  <p style="margin-top:20px;"><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
{% endblock %}
