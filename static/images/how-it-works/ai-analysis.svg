<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ai-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="ai-glow-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Ambient Pastel Accents in Background -->
  <circle cx="190" cy="44" r="42" fill="#F5F3FF" opacity="0.9"/>
  <circle cx="35" cy="35" r="18" fill="#EDE9FE" opacity="0.5"/>
  <circle cx="345" cy="180" r="22" fill="#F5F3FF" opacity="0.6"/>

  <!-- Top Central AI Sparkle & Node Header -->
  <g transform="translate(190, 10)" text-anchor="middle">
    <!-- Sparkle ✦ -->
    <path d="M0 -2 L1.5 2.5 L6 4 L1.5 5.5 L0 10 L-1.5 5.5 L-6 4 L-1.5 2.5 Z" fill="#7C3AED"/>
    <text x="0" y="22" fill="#7C3AED" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1">AI ANALYSIS</text>
  </g>

  <!-- Center AI Node -->
  <g transform="translate(190, 48)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#ai-glow-shadow)"/>
    <circle cx="0" cy="0" r="14" fill="url(#ai-node-grad)"/>
    <!-- Robot / Neural Chip Vector Icon -->
    <rect x="-7" y="-6" width="14" height="11" rx="3" fill="#FFFFFF"/>
    <circle cx="-3" cy="-1" r="1.2" fill="#7C3AED"/>
    <circle cx="3" cy="-1" r="1.2" fill="#7C3AED"/>
    <line x1="0" y1="-10" x2="0" y2="-6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Branching Connector Lines (Clean Dashed Purple) -->
  <path d="M172 52 L95 86" stroke="#C4B5FD" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M208 52 L285 86" stroke="#C4B5FD" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 4 Small Result Cards (2x2 Grid) -->

  <!-- Card 1: Category -> Plumbing -->
  <g transform="translate(25, 86)">
    <rect x="0" y="0" width="158" height="48" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1" filter="url(#ai-glow-shadow)"/>
    <rect x="8" y="8" width="6" height="6" rx="3" fill="#7C3AED"/>
    <text x="18" y="14" fill="#64748B" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600">Category</text>
    <text x="10" y="34" fill="#172033" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="700">Plumbing</text>
    <rect x="96" y="16" width="52" height="18" rx="9" fill="#F5F3FF"/>
    <text x="122" y="28.5" fill="#7C3AED" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">96% match</text>
  </g>

  <!-- Card 2: Priority -> High -->
  <g transform="translate(197, 86)">
    <rect x="0" y="0" width="158" height="48" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" filter="url(#ai-glow-shadow)"/>
    <circle cx="11" cy="11" r="3" fill="#DC2626"/>
    <text x="18" y="14" fill="#64748B" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600">Priority</text>
    <text x="10" y="34" fill="#DC2626" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="700">High Risk</text>
    <rect x="96" y="16" width="52" height="18" rx="9" fill="#FEF2F2"/>
    <text x="122" y="28.5" fill="#DC2626" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Urgent SLA</text>
  </g>

  <!-- Card 3: Resolution -> 2.3 days -->
  <g transform="translate(25, 144)">
    <rect x="0" y="0" width="158" height="48" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" filter="url(#ai-glow-shadow)"/>
    <rect x="8" y="8" width="6" height="6" rx="3" fill="#2563EB"/>
    <text x="18" y="14" fill="#64748B" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600">Resolution</text>
    <text x="10" y="34" fill="#172033" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="700">2.3 days</text>
    <rect x="96" y="16" width="52" height="18" rx="9" fill="#EFF6FF"/>
    <text x="122" y="28.5" fill="#2563EB" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Est. Time</text>
  </g>

  <!-- Card 4: Similarity -> 78% -->
  <g transform="translate(197, 144)">
    <rect x="0" y="0" width="158" height="48" rx="10" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1" filter="url(#ai-glow-shadow)"/>
    <circle cx="11" cy="11" r="3" fill="#0D9488"/>
    <text x="18" y="14" fill="#64748B" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600">Similarity</text>
    <text x="10" y="34" fill="#0D9488" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="700">78% Match</text>
    <rect x="96" y="16" width="52" height="18" rx="9" fill="#F0FDFA"/>
    <text x="122" y="28.5" fill="#0D9488" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Common</text>
  </g>
</svg>